name: Flutter validation

on:
  pull_request:
    paths:
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'slang.yaml'
      - '.github/workflows/flutter-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'slang.yaml'
      - '.github/workflows/flutter-validation.yml'

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization and provider code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze

      - name: Test Ollama provider
        run: flutter test test/unit/services/llm/ollama_provider_test.dart

      - name: Test provider factory
        run: flutter test test/services/llm/llm_provider_factory_test.dart
