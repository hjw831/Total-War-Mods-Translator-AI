name: Flutter validation

on:
  pull_request:
    paths:
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'slang.yaml'
      - '.github/workflows/flutter-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'slang.yaml'
      - '.github/workflows/flutter-validation.yml'

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization and provider code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze changed Dart files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit is available; skipping changed-file analysis."
            exit 0
          fi

          mapfile -t changed_dart_files < <(git diff --name-only "$base_sha"...HEAD -- '*.dart')
          if [ "${#changed_dart_files[@]}" -eq 0 ]; then
            echo "No changed Dart files to analyze."
          else
            printf 'Analyzing changed Dart files:\\n%s\\n' "${changed_dart_files[@]}"
            flutter analyze "${changed_dart_files[@]}"
          fi

      - name: Test Ollama provider
        run: flutter test test/unit/services/llm/ollama_provider_test.dart

      - name: Test provider factory
        run: flutter test test/services/llm/llm_provider_factory_test.dart

      - name: Test Ollama model registration
        run: flutter test test/unit/services/llm/llm_model_management_service_ollama_test.dart

      - name: Test model repository validation
        run: flutter test test/unit/repositories/llm_provider_model_repository_test.dart

      - name: Test isolated test data path policy
        run: flutter test test/config/isolated_database_config_test.dart
